# Socioeconomic tables from HDX HAPI for this instance's country (`extent.country_code`), per
# admin 2 area of the HDX COD-AB boundaries (plugins/vectors/hdx.yaml), which share HAPI's
# p-codes: fetch `hdx_cod_ab_admin2` first. Set HDX_HAPI_APP_IDENTIFIER in .env. Not every
# country is in HAPI; its metadata/data-availability endpoint lists what is.
- id: hdx_hapi_food_security
  name: Food insecurity by district (IPC / Cadre Harmonisé, HDX HAPI)
  description: >-
    People in each phase of acute food insecurity per admin 2 area, from the current IPC or Cadre
    Harmonisé analyses, through HDX HAPI. A row is dated by the first month of its analysis
    period, usually March to May or October to December; `class` is the phase, 1 to 5, `3+`
    (phases 3 to 5) or `all` (the population analysed).
  source: Integrated Food Security Phase Classification (IPC), via HDX HAPI
  source_url: https://data.humdata.org/dataset/global-acute-food-insecurity-country-data
  license:
    name: Public Domain / No restrictions
  providers:
    - {name: Integrated Food Security Phase Classification (IPC), url: https://www.ipcinfo.org, roles: [producer]}
    - {name: OCHA Centre for Humanitarian Data, url: https://data.humdata.org, roles: [processor]}
  period_type: monthly
  collection: hdx_cod_ab_admin2
  ingestion:
    plugin: open_geo_service.plugins.tables.hdx_hapi.HapiTablePlugin
    params:
      endpoint: food-security-nutrition-poverty/food-security
      filters: {ipc_type: current}
      columns: {class: ipc_phase, value: population_in_phase}
      constants: {unit: people}
